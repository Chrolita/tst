<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Conectare Wallet</title>
  <script type="module">
    import { getWallets } from "https://esm.sh/@mysten/wallet-standard";

    async function connectWallet() {
      const wallets = getWallets().get();
      const slush = wallets.find(w => w.name.toLowerCase().includes("slush"));

      if (!slush) {
        alert("Slush Wallet nu este instalat.");
        return;
      }

      try {
        const response = await slush.features["standard:connect"].connect();
        const address = response.accounts[0].address;
        window.location.href = `index.html?wallet=${address}`;
      } catch (error) {
        alert("Eroare la conectare: " + error.message);
      }
    }

    window.onload = connectWallet;
  </script>
</head>
<body>
  <h1>Se conectează la Slush Wallet...</h1>
</body>
</html>
